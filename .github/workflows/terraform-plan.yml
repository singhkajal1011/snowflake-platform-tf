name: Terraform Plan

# Terraform runs FIRST, DCM runs SECOND, always, one after another -- per client
# direction, DCM's identity (GITHUB_DEV_DCM_SVC) is created by Terraform, so DCM must never
# plan/deploy without a guaranteed-successful Terraform run immediately before it. Workflow
# files stay separate (CI load, PR-check naming, and CODEOWNERS routing still scoped
# per-tool), but execution is sequenced: dcm-plan.yml triggers via `workflow_run` on THIS
# workflow's completion (see that file's header comment for the full mechanism, including
# why it needs the Checks API to still satisfy branch protection).
#
# This is why the path filter below includes dcm/** as well as terraform/** -- a DCM-only
# PR must also run Terraform Plan first, so dcm-plan.yml has something to chain from.
#
# Pull-request plans are configured to use DEV and do not accept an environment input.
# Manual plans can select DEV or TEST, both of which have matching Terraform
# state/configuration and Snowflake OIDC identities. PROD is not wired yet.

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "dcm/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to plan (PR plans always use DEV)
        required: true
        type: choice
        default: dev
        options:
          - dev
          - test

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  validate-pr-author:
    name: Validate PR Author
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Wait for trusted PR author authorization
        uses: actions/github-script@v7
        env:
          PLAN_AUTH_APP_ID: ${{ vars.PLAN_AUTH_APP_ID }}
        with:
          script: |
            const appId = Number(process.env.PLAN_AUTH_APP_ID);
            if (!appId) {
              core.setFailed('Repository variable PLAN_AUTH_APP_ID is not configured.');
              return;
            }

            const headSha = context.payload.pull_request.head.sha;
            const checkName = 'Terraform Plan Author Authorization';
            const maxAttempts = 60;

            for (let attempt = 0; attempt < maxAttempts; attempt++) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
                per_page: 100
              });
              const authorization = data.check_runs
                .filter(check => check.name === checkName && check.app?.id === appId)
                .sort((a, b) => Date.parse(b.started_at) - Date.parse(a.started_at))[0];

              if (authorization?.status === 'completed') {
                if (authorization.conclusion !== 'success') {
                  core.setFailed(`PR author authorization failed: ${authorization.output?.summary || authorization.conclusion}`);
                }
                return;
              }

              await new Promise(resolve => setTimeout(resolve, 10000));
            }

            core.setFailed(
              'Timed out waiting for Terraform Plan Author Authorization. ' +
              'Wait for the authorization check to finish, then rerun this workflow.'
            );

  validate-manual-actor:
    name: Validate Manual Dispatcher
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: PLAN-AUTHORIZATION
    permissions:
      contents: read
    steps:
      - name: Require dispatch from the default branch
        uses: actions/github-script@v7
        with:
          script: |
            if (context.ref !== 'refs/heads/main') {
              core.setFailed('Dispatch Terraform Plan from the main branch only.');
            }

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PLAN_AUTH_APP_ID }}
          private-key: ${{ secrets.PLAN_AUTH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read

      - name: Check dispatcher repository role
        uses: actions/github-script@v7
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const user = process.env.TRIGGERING_ACTOR;
            const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: user
            });
            if (!['admin', 'maintain'].includes(access.role_name)) {
              core.setFailed(
                `User ${user} has repository role "${access.role_name}" and must have admin or maintain permission.`
              );
            }

  plan:
    name: Terraform Plan (${{ github.event_name == 'pull_request' && 'dev' || inputs.target_environment }})
    needs: [validate-pr-author, validate-manual-actor]
    if: >-
      always() &&
      (needs.validate-pr-author.result == 'success' || needs.validate-pr-author.result == 'skipped') &&
      (needs.validate-manual-actor.result == 'success' || needs.validate-manual-actor.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'DEV-Terraform' || (inputs.target_environment == 'test' && 'TEST-Terraform' || 'DEV-Terraform') }}

    env:
      TF_VAR_snowflake_organization_name: xygpmhm
      TF_VAR_snowflake_account_name: gq04150
      TARGET_ENV: ${{ github.event_name == 'pull_request' && 'dev' || inputs.target_environment }}

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::525218385225:role/snowflake-platform-tf-github-oidc-singhkajal1011
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Fetch Snowflake OIDC token
        run: |
          TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=snowflakecomputing.com" | jq -r '.value')
          echo "::add-mask::$TOKEN"
          echo "SNOWFLAKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Terraform Init
        run: terraform init -backend-config="env/${{ env.TARGET_ENV }}/backend.hcl"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -var-file="env/${{ env.TARGET_ENV }}/${{ env.TARGET_ENV }}.tfvars" -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Post plan as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n\n...output truncated' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan (${process.env.TARGET_ENV})\n\`\`\`\n${truncated}\n\`\`\``
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
