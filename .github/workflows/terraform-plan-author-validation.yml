name: Terraform Plan Author Validation

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, reopened, synchronize]
    paths:
      - "terraform/**"
      - "dcm/**"
      - ".github/workflows/terraform-plan.yml"
      - ".github/workflows/terraform-plan-author-validation.yml"

permissions:
  contents: read

jobs:
  authorize:
    name: Terraform Plan Author Authorization
    runs-on: ubuntu-latest
    environment: PLAN-AUTHORIZATION
    permissions:
      pull-requests: read
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PLAN_AUTH_APP_ID }}
          private-key: ${{ secrets.PLAN_AUTH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-checks: write

      - name: Check PR author repository role
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const pullRequest = context.payload.pull_request;
            const author = pullRequest.user.login;
            const checkName = 'Terraform Plan Author Authorization';
            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: checkName,
              head_sha: pullRequest.head.sha,
              status: 'in_progress',
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: {
                title: 'Checking pull request author role',
                summary: `Checking whether @${author} has repository admin or maintain permission.`
              }
            });

            try {
              const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: author
              });
              if (!['admin', 'maintain'].includes(access.role_name)) {
                throw new Error(
                  `PR author @${author} has repository role "${access.role_name}" and must have admin or maintain permission.`
                );
              }

              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: check.id,
                status: 'completed',
                conclusion: 'success',
                output: {
                  title: 'PR author is authorized',
                  summary: `@${author} has repository role "${access.role_name}".`
                }
              });
            } catch (error) {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: check.id,
                status: 'completed',
                conclusion: 'failure',
                output: {
                  title: 'PR author is not authorized',
                  summary: error.message
                }
              });
              core.setFailed(error.message);
            }
