name: DCM Deploy

# Terraform runs FIRST, DCM runs SECOND. This workflow starts only after a successful
# Terraform Apply, then plans the changed DCM domains, waits for a required-reviewer
# approval, and deploys those same domains.

on:
  workflow_run:
    workflows: ["Terraform Apply"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dcm-dev-deploy
  cancel-in-progress: false

jobs:
  dcm-plan:
    name: DCM Plan (DEV)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: DEV-DCM
    outputs:
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      domains: ${{ steps.detect.outputs.domains }}
      has_domains: ${{ steps.detect.outputs.has_domains }}

    env:
      SNOWFLAKE_ACCOUNT: xygpmhm-gq04150
      SNOWFLAKE_USER: GITHUB_DEV_DCM_SVC
      SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: OIDC

    defaults:
      run:
        working-directory: dcm

    steps:
      - name: Resolve head commit to plan
        id: resolve
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "head_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Snowflake CLI (OIDC)
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Create default Snowflake CLI connection (OIDC)
        run: |
          snow connection add \
            --connection-name github \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "$SNOWFLAKE_USER" \
            --role SYSADMIN \
            --authenticator WORKLOAD_IDENTITY \
            --workload-identity-provider OIDC \
            --default \
            --no-interactive

      - name: Detect which domains changed
        id: detect
        env:
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DOMAINS=$(bash detect-changed-domains.sh ALL)
          else
            BASE_SHA=$(git rev-parse "$HEAD_SHA^")
            DOMAINS=$(bash detect-changed-domains.sh "$BASE_SHA" "$HEAD_SHA")
          fi
          echo "Domains to plan: $DOMAINS"
          echo "domains=$DOMAINS" >> "$GITHUB_OUTPUT"
          if [ "$(echo "$DOMAINS" | jq 'length')" -gt 0 ]; then
            echo "has_domains=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_domains=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan each changed domain
        id: plan_all
        env:
          DOMAINS: ${{ steps.detect.outputs.domains }}
        run: |
          set -o pipefail
          OVERALL_STATUS=0
          : > all_domains_plan_output.txt
          for row in $(echo "$DOMAINS" | jq -c '.[]'); do
            NAME=$(echo "$row" | jq -r '.name')
            TARGET=$(echo "$row" | jq -r '.target')
            echo "::group::DCM Plan - $NAME"
            bash sync-domain.sh "$NAME"
            snow dcm create --target "$TARGET" --from "domains/$NAME" --if-not-exists
            {
              echo "=== $NAME ($TARGET) ==="
              snow dcm plan --target "$TARGET" --from "domains/$NAME" 2>&1
            } | tee -a all_domains_plan_output.txt
            DOMAIN_STATUS=${PIPESTATUS[0]}
            if [ "$DOMAIN_STATUS" -ne 0 ]; then
              OVERALL_STATUS=1
            fi
            echo "::endgroup::"
          done
          if [ -s all_domains_plan_output.txt ]; then
            {
              echo "## DCM Plan (DEV)"
              echo '```text'
              cat all_domains_plan_output.txt
              echo '```'
              echo
              echo "Approval prompt: OK to apply the planned DCM object changes above for these domains?"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## DCM Plan (DEV)" >> "$GITHUB_STEP_SUMMARY"
            echo "No active DCM domains changed; no DCM deployment is needed." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $OVERALL_STATUS

  approve-dcm-deploy:
    name: "Approve DCM Deploy: OK to apply the planned DCM object changes?"
    needs: dcm-plan
    if: needs.dcm-plan.outputs.has_domains == 'true'
    runs-on: ubuntu-latest
    environment:
      name: DEV-DCM-Apply
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      contents: read
    steps:
      - name: Record approval
        run: echo "DCM plan approved; deploying the planned domains."

  dcm-deploy:
    name: DCM Deploy (DEV)
    needs: [dcm-plan, approve-dcm-deploy]
    if: needs.dcm-plan.outputs.has_domains == 'true'
    runs-on: ubuntu-latest
    environment:
      name: DEV-DCM

    env:
      SNOWFLAKE_ACCOUNT: xygpmhm-gq04150
      SNOWFLAKE_USER: GITHUB_DEV_DCM_SVC
      SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: OIDC

    defaults:
      run:
        working-directory: dcm

    steps:
      - name: Checkout planned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.dcm-plan.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Snowflake CLI (OIDC)
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Create default Snowflake CLI connection (OIDC)
        run: |
          snow connection add \
            --connection-name github \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "$SNOWFLAKE_USER" \
            --role SYSADMIN \
            --authenticator WORKLOAD_IDENTITY \
            --workload-identity-provider OIDC \
            --default \
            --no-interactive

      - name: Verify planned commit is still the main branch tip
        uses: actions/github-script@v7
        env:
          PLANNED_SHA: ${{ needs.dcm-plan.outputs.head_sha }}
        with:
          script: |
            const { data: main } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            });
            if (main.object.sha !== process.env.PLANNED_SHA) {
              core.setFailed(
                'The reviewed DCM plan is no longer for the main branch tip. ' +
                'Review the latest run before deploying.'
              );
            }

      - name: Deploy each planned domain
        env:
          DOMAINS: ${{ needs.dcm-plan.outputs.domains }}
        run: |
          OVERALL_STATUS=0
          for row in $(echo "$DOMAINS" | jq -c '.[]'); do
            NAME=$(echo "$row" | jq -r '.name')
            TARGET=$(echo "$row" | jq -r '.target')
            echo "::group::DCM Deploy - $NAME"
            bash sync-domain.sh "$NAME"
            snow dcm create --target "$TARGET" --from "domains/$NAME" --if-not-exists
            if ! snow dcm deploy --target "$TARGET" --from "domains/$NAME"; then
              OVERALL_STATUS=1
            fi
            echo "::endgroup::"
          done
          exit $OVERALL_STATUS
